<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATD 가치표 & 거래 계산기</title>
    <style>
        :root {
            --bg-dark: #0f1117; 
            --panel-bg: #161b22;
            --card-bg: #21262d;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;

            /* 등급별 색상 */
            --rarity-common: #a6b1b7;
            --rarity-uncommon: #2ecc71;
            --rarity-rare: #3498db;
            --rarity-epic: #9b59b6;
            --rarity-legendary: #f1c40f;
            --rarity-mythical: #e74c3c;
            --rarity-exclusive: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* 네비게이션 헤더 */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            color: #fff;
            border-color: #8b949e;
        }

        .nav-btn.active {
            background-color: #238636;
            border-color: #2e9e44;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==================== 1. 가치표 페이지 (Value List) ==================== */
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .search-input {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            width: 280px;
            font-size: 14px;
        }

        .rarity-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-chip.active, .filter-chip:hover {
            background-color: #30363d;
            color: #fff;
        }

        .value-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .unit-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .unit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .unit-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .unit-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            background-color: var(--panel-bg);
            margin: 0 auto 10px;
        }

        .unit-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unit-val {
            font-size: 16px;
            font-weight: 800;
            color: #2ecc71;
        }

        /* 등급별 바이블 색상 설정 */
        .badge-Common { background-color: var(--rarity-common); color: #000; }
        .badge-Uncommon { background-color: var(--rarity-uncommon); color: #000; }
        .badge-Rare { background-color: var(--rarity-rare); color: #fff; }
        .badge-Epic { background-color: var(--rarity-epic); color: #fff; }
        .badge-Legendary { background-color: var(--rarity-legendary); color: #000; }
        .badge-Mythical { background-color: var(--rarity-mythical); color: #fff; }
        .badge-Exclusive { background-color: var(--rarity-exclusive); color: #fff; }

        /* ==================== 2. 거래 계산기 페이지 (Trade Calculator) ==================== */
        .trade-container {
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            gap: 20px;
            align-items: start;
        }

        .offer-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .offer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .offer-title {
            font-size: 18px;
            font-weight: 700;
        }

        .offer-value {
            font-size: 18px;
            font-weight: 800;
            color: #2ecc71;
        }

        .add-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }

        .add-btn:hover { background-color: #2ea043; }

        .selected-units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            flex: 1;
        }

        .calc-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            position: relative;
        }

        .calc-item-card img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        .calc-item-card .name {
            font-size: 11px;
            font-weight: bold;
            margin: 4px 0 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calc-item-card .val {
            font-size: 11px;
            color: #2ecc71;
            font-weight: bold;
        }

        .remove-icon {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--rarity-mythical);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            line-height: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        /* VS 및 거래 결과 영역 */
        .vs-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding-top: 100px;
        }

        .vs-badge {
            font-size: 28px;
            font-weight: 900;
            color: var(--text-sub);
        }

        .trade-result {
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            text-align: center;
            width: 100%;
        }

        .result-fair { background: #313214; color: #f1c40f; border: 1px solid #f1c40f; }
        .result-win { background: #132e19; color: #2ecc71; border: 1px solid #2ecc71; }
        .result-lose { background: #3a171a; color: #e74c3c; border: 1px solid #e74c3c; }

        /* 모달 팝업 (유닛 선택창) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .modal-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }

        .modal-item:hover { border-color: #fff; }
        .modal-item img { width: 55px; height: 55px; border-radius: 6px; }

        @media (max-width: 850px) {
            .trade-container { grid-template-columns: 1fr; }
            .vs-section { padding-top: 0; }
        }
    </style>
</head>
<body>

    <!-- 헤더 / 상단 탭 -->
    <header>
        <div class="logo">💎 NATD Value Hub</div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('valuelist')">📊 가치표</button>
            <button class="nav-btn" onclick="switchTab('calculator')">⚖️ 거래 계산기</button>
        </div>
    </header>

    <div class="container">
        
        <!-- ================= PAGE 1: 가치표 (Value List) ================= -->
        <div id="valuelist" class="tab-content active">
            <div class="filter-section">
                <input type="text" id="searchBar" class="search-input" placeholder="유닛 이름 검색..." onkeyup="filterValueList()">
                
                <div class="rarity-filters">
                    <button class="filter-chip active" onclick="filterRarity('ALL', this)">ALL</button>
                    <button class="filter-chip" onclick="filterRarity('Common', this)">Common</button>
                    <button class="filter-chip" onclick="filterRarity('Uncommon', this)">Uncommon</button>
                    <button class="filter-chip" onclick="filterRarity('Rare', this)">Rare</button>
                    <button class="filter-chip" onclick="filterRarity('Epic', this)">Epic</button>
                    <button class="filter-chip" onclick="filterRarity('Legendary', this)">Legendary</button>
                    <button class="filter-chip" onclick="filterRarity('Mythical', this)">Mythical</button>
                    <button class="filter-chip" onclick="filterRarity('Exclusive', this)">Exclusive</button>
                </div>
            </div>

            <div id="valueGrid" class="value-grid">
                <!-- JS로 카드가 로드됩니다 -->
            </div>
        </div>

        <!-- ================= PAGE 2: 거래 계산기 (Trade Calculator) ================= -->
        <div id="calculator" class="tab-content">
            <div class="trade-container">
                
                <!-- 내 아이템 -->
                <div class="offer-box">
                    <div class="offer-header">
                        <span class="offer-title">내 제안 (My Offer)</span>
                        <span class="offer-value">💎 <span id="myTotal">0</span></span>
                    </div>
                    <button class="add-btn" onclick="openPicker('my')">+ 유닛 추가하기</button>
                    <div id="myOfferGrid" class="selected-units-grid"></div>
                </div>

                <!-- VS & 거래 결과 -->
                <div class="vs-section">
                    <div class="vs-badge">VS</div>
                    <div id="tradeResult" class="trade-result result-fair">⚖️ 공정한 거래</div>
                </div>

                <!-- 상대 아이템 -->
                <div class="offer-box">
                    <div class="offer-header">
                        <span class="offer-title">상대 제안 (Their Offer)</span>
                        <span class="offer-value">💎 <span id="theirTotal">0</span></span>
                    </div>
                    <button class="add-btn" onclick="openPicker('their')">+ 유닛 추가하기</button>
                    <div id="theirOfferGrid" class="selected-units-grid"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- 유닛 선택 모달 팝업 -->
    <div id="unitModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>유닛 추가</h3>
                <button onclick="closePicker()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div id="modalGrid" class="modal-grid">
                <!-- 선택 가능한 유닛 목록 -->
            </div>
        </div>
    </div>

    <script>
        // 요청해주신 NATD 유닛 20종 정밀 데이터
        const unitData = [
            // Common
            { name: "Noob", rarity: "Common", value: 1, img: "NATD/Noob.png" },

            // Uncommon
            { name: "Soldier Noob", rarity: "Uncommon", value: 3, img: "NATD/Soldier Noob.png" },
            { name: "Zombie Noob", rarity: "Uncommon", value: 3, img: "NATD/Zombie Noob.png" },

            // Rare
            { name: "Boxer Noob", rarity: "Rare", value: 6, img: "NATD/Boxer Noob.png" },
            { name: "SledgeHammer Noob", rarity: "Rare", value: 7, img: "NATD/SledgeHammer Noob.png" },
            { name: "Spear Noob", rarity: "Rare", value: 10, img: "NATD/Spear Noob.png" },

            // Epic
            { name: "Medic Noob", rarity: "Epic", value: 20, img: "NATD/Medic Noob.png" },
            { name: "Knight Noob", rarity: "Epic", value: 40, img: "NATD/Knight Noob.png" },
            { name: "Ninja Noob", rarity: "Epic", value: 70, img: "NATD/Ninja Noob.png" },
            { name: "Shielder Noob", rarity: "Epic", value: 70, img: "NATD/Shielder Noob.png" },

            // Legendary
            { name: "Gunner Noob", rarity: "Legendary", value: 100, img: "NATD/Gunner Noob.png" },
            { name: "Barbarian Noob", rarity: "Legendary", value: 150, img: "NATD/Barbarian Noob.png" },
            { name: "Nature Noob", rarity: "Legendary", value: 250, img: "NATD/Nature Noob.png" },
            { name: "Builder Noob", rarity: "Legendary", value: 300, img: "NATD/Builder Noob.png" },

            // Mythical
            { name: "Laser Noob", rarity: "Mythical", value: 800, img: "NATD/Laser Noob.png" },
            { name: "Magical Noob", rarity: "Mythical", value: 1500, img: "NATD/Magical Noob.png" },
            { name: "King Noob", rarity: "Mythical", value: 2000, img: "NATD/King Noob.png" },
            { name: "Hologram Noob", rarity: "Mythical", value: 3000, img: "NATD/Hologram Noob.png" },

            // Exclusive
            { name: "Fairy Noob", rarity: "Exclusive", value: 250, img: "NATD/Fairy Noob.png" },
            { name: "Mafia Noob", rarity: "Exclusive", value: 900, img: "NATD/Mafia Noob.png" }
        ];

        let currentCategory = 'ALL';
        let myOffer = [];
        let theirOffer = [];
        let activeTargetSide = 'my';

        // 탭 전환 함수
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // ================= 1. 가치표 랜더링 =================
        function renderValueList() {
            const grid = document.getElementById('valueGrid');
            const searchText = document.getElementById('searchBar').value.toLowerCase();
            grid.innerHTML = '';

            unitData.forEach(unit => {
                const matchesCategory = currentCategory === 'ALL' || unit.rarity === currentCategory;
                const matchesSearch = unit.name.toLowerCase().includes(searchText);

                if (matchesCategory && matchesSearch) {
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.innerHTML = `
                        <div class="unit-badge badge-${unit.rarity}">${unit.rarity}</div>
                        <img src="${unit.img}" class="unit-img" alt="${unit.name}" onerror="this.src='https://via.placeholder.com/90?text=NATD'">
                        <div class="unit-title">${unit.name}</div>
                        <div class="unit-val">💎 ${unit.value.toLocaleString()}</div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        function filterRarity(rarity, btn) {
            currentCategory = rarity;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderValueList();
        }

        function filterValueList() {
            renderValueList();
        }

        // ================= 2. 계산기 로직 =================
        function openPicker(side) {
            activeTargetSide = side;
            const modalGrid = document.getElementById('modalGrid');
            modalGrid.innerHTML = '';

            unitData.forEach(unit => {
                const item = document.createElement('div');
                item.className = 'modal-item';
                item.onclick = () => addUnitToOffer(unit);
                item.innerHTML = `
                    <img src="${unit.img}" onerror="this.src='https://via.placeholder.com/55?text=NATD'">
                    <div style="font-size:11px; font-weight:bold; margin-top:4px;">${unit.name}</div>
                    <div style="font-size:11px; color:#2ecc71;">💎 ${unit.value}</div>
                `;
                modalGrid.appendChild(item);
            });

            document.getElementById('unitModal').style.display = 'flex';
        }

        function closePicker() {
            document.getElementById('unitModal').style.display = 'none';
        }

        function addUnitToOffer(unit) {
            if (activeTargetSide === 'my') {
                myOffer.push(unit);
            } else {
                theirOffer.push(unit);
            }
            closePicker();
            updateTradeCalculator();
        }

        function removeUnitFromOffer(side, index) {
            if (side === 'my') {
                myOffer.splice(index, 1);
            } else {
                theirOffer.splice(index, 1);
            }
            updateTradeCalculator();
        }

        function updateTradeCalculator() {
            const myGrid = document.getElementById('myOfferGrid');
            const theirGrid = document.getElementById('theirOfferGrid');
            
            myGrid.innerHTML = '';
            theirGrid.innerHTML = '';

            let mySum = 0;
            let theirSum = 0;

            myOffer.forEach((unit, index) => {
                mySum += unit.value;
                myGrid.appendChild(createCalcCard(unit, 'my', index));
            });

            theirOffer.forEach((unit, index) => {
                theirSum += unit.value;
                theirGrid.appendChild(createCalcCard(unit, 'their', index));
            });

            document.getElementById('myTotal').innerText = mySum.toLocaleString();
            document.getElementById('theirTotal').innerText = theirSum.toLocaleString();

            // 손익 가치 판단 (WIN / FAIR / LOSE)
            const resultBox = document.getElementById('tradeResult');
            const diff = mySum - theirSum;

            if (mySum === 0 && theirSum === 0) {
                resultBox.className = 'trade-result result-fair';
                resultBox.innerText = '⚖️ 공정한 거래';
            } else if (Math.abs(diff) <= Math.max(mySum, theirSum) * 0.1) { // 10% 이내 차이면 공정
                resultBox.className = 'trade-result result-fair';
                resultBox.innerText = '⚖️ 공정한 거래';
            } else if (diff < 0) { // 내 거래 가치가 더 작으면 이득
                resultBox.className = 'trade-result result-win';
                resultBox.innerText = `🎉 이득 (+${Math.abs(diff).toLocaleString()} 젬)`;
            } else { // 내 거래 가치가 더 크면 손해
                resultBox.className = 'trade-result result-lose';
                resultBox.innerText = `🔻 손해 (-${diff.toLocaleString()} 젬)`;
            }
        }

        function createCalcCard(unit, side, index) {
            const card = document.createElement('div');
            card.className = 'calc-item-card';
            card.innerHTML = `
                <div class="remove-icon" onclick="removeUnitFromOffer('${side}', ${index})">✕</div>
                <img src="${unit.img}" onerror="this.src='https://via.placeholder.com/50?text=NATD'">
                <div class="name">${unit.name}</div>
                <div class="val">💎 ${unit.value.toLocaleString()}</div>
            `;
            return card;
        }

        // 초기화 실행
        renderValueList();
    </script>
</body>
</html>
