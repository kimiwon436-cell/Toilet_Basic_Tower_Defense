<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATD 가치 계산기</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --card-bg: #2c2c2c;
            --text-color: #ffffff;
            --border-color: #333333;
            
            /* 등급별 색상 정의 */
            --common: #B0BEC5;    /* Common - 회색 */
            --uncommon: #4CAF50;  /* Uncommon - 초록 */
            --rare: #2196F3;      /* Rare - 파랑 */
            --epic: #9C27B0;      /* Epic - 보라 */
            --legendary: #FFC107; /* Legendary - 금색/노랑 */
            --mythical: #F44336;  /* Mythical - 빨강 */
            --exclusive: #FF4081; /* Exclusive - 핑크 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* 왼쪽 유닛 리스트 */
        .unit-list-panel {
            flex: 2;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            height: 85vh;
            overflow-y: auto;
        }

        /* 오른쪽 계산기 패널 */
        .calculator-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: white;
            font-size: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        /* 유닛 카드 스타일 */
        .unit-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .unit-card:hover {
            transform: translateY(-4px);
            border-color: #ffffff;
        }

        .unit-card img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            background-color: #1a1a1a;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .unit-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            word-break: keep-all;
        }

        .unit-value {
            font-size: 13px;
            color: #4CAF50;
            font-weight: bold;
        }

        .unit-rarity {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
        }

        /* 등급별 라벨 색상 */
        .Common { background-color: var(--common); color: #111; }
        .Uncommon { background-color: var(--uncommon); }
        .Rare { background-color: var(--rare); }
        .Epic { background-color: var(--epic); }
        .Legendary { background-color: var(--legendary); color: #111; }
        .Mythical { background-color: var(--mythical); }
        .Exclusive { background-color: var(--exclusive); }

        /* 선택 목록 UI */
        .calc-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            text-align: center;
        }

        .selected-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 5px solid gray;
        }

        .selected-item.Common { border-left-color: var(--common); }
        .selected-item.Uncommon { border-left-color: var(--uncommon); }
        .selected-item.Rare { border-left-color: var(--rare); }
        .selected-item.Epic { border-left-color: var(--epic); }
        .selected-item.Legendary { border-left-color: var(--legendary); }
        .selected-item.Mythical { border-left-color: var(--mythical); }
        .selected-item.Exclusive { border-left-color: var(--exclusive); }

        .remove-btn {
            background-color: var(--mythical);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn:hover {
            background-color: #d32f2f;
        }

        .total-box {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--legendary);
            border: 1px solid var(--border-color);
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            background-color: #424242;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .clear-btn:hover {
            background-color: #616161;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .unit-list-panel, .calculator-panel { height: auto; max-height: 50vh; }
        }
    </style>
</head>
<body>

    <h1>💎 NATD 가치 계산기</h1>

    <div class="container">
        <!-- 유닛 선택 목록 -->
        <div class="unit-list-panel">
            <input type="text" id="searchInput" class="search-bar" placeholder="유닛 이름 검색..." onkeyup="filterUnits()">
            <div id="unitGrid" class="grid-container"></div>
        </div>

        <!-- 선택된 유닛 및 가치 계산 -->
        <div class="calculator-panel">
            <div class="calc-header">선택한 유닛</div>
            <div id="selectedList" class="selected-list"></div>
            
            <div class="total-box">
                총 가치: <span id="totalValue">0</span> 젬
            </div>
            <button class="clear-btn" onclick="clearCalculator()">전체 초기화</button>
        </div>
    </div>

    <script>
        // 요청하신 NATD 유닛 20종 데이터
        const unitData = [
            // Common
            { name: "Noob", rarity: "Common", value: 1, img: "NATD/Noob.png" },

            // Uncommon
            { name: "Soldier Noob", rarity: "Uncommon", value: 3, img: "NATD/Soldier Noob.png" },
            { name: "Zombie Noob", rarity: "Uncommon", value: 3, img: "NATD/Zombie Noob.png" },

            // Rare
            { name: "Boxer Noob", rarity: "Rare", value: 6, img: "NATD/Boxer Noob.png" },
            { name: "SledgeHammer Noob", rarity: "Rare", value: 7, img: "NATD/SledgeHammer Noob.png" },
            { name: "Spear Noob", rarity: "Rare", value: 10, img: "NATD/Spear Noob.png" },

            // Epic
            { name: "Knight Noob", rarity: "Epic", value: 40, img: "NATD/Knight Noob.png" },
            { name: "Medic Noob", rarity: "Epic", value: 20, img: "NATD/Medic Noob.png" },
            { name: "Ninja Noob", rarity: "Epic", value: 70, img: "NATD/Ninja Noob.png" },
            { name: "Shielder Noob", rarity: "Epic", value: 70, img: "NATD/Shielder Noob.png" },

            // Legendary
            { name: "Barbarian Noob", rarity: "Legendary", value: 150, img: "NATD/Barbarian Noob.png" },
            { name: "Builder Noob", rarity: "Legendary", value: 300, img: "NATD/Builder Noob.png" },
            { name: "Gunner Noob", rarity: "Legendary", value: 100, img: "NATD/Gunner Noob.png" },
            { name: "Nature Noob", rarity: "Legendary", value: 250, img: "NATD/Nature Noob.png" },

            // Mythical
            { name: "Hologram Noob", rarity: "Mythical", value: 3000, img: "NATD/Hologram Noob.png" },
            { name: "King Noob", rarity: "Mythical", value: 2000, img: "NATD/King Noob.png" },
            { name: "Laser Noob", rarity: "Mythical", value: 800, img: "NATD/Laser Noob.png" },
            { name: "Magical Noob", rarity: "Mythical", value: 1500, img: "NATD/Magical Noob.png" },

            // Exclusive
            { name: "Fairy Noob", rarity: "Exclusive", value: 250, img: "NATD/Fairy Noob.png" },
            { name: "Mafia Noob", rarity: "Exclusive", value: 900, img: "NATD/Mafia Noob.png" }
        ];

        let selectedUnits = [];

        // 유닛 카드 화면에 표시
        function renderUnits(filterText = "") {
            const grid = document.getElementById('unitGrid');
            grid.innerHTML = '';

            unitData.forEach(unit => {
                if (unit.name.toLowerCase().includes(filterText.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.onclick = () => addUnitToCalc(unit);

                    card.innerHTML = `
                        <img src="${unit.img}" alt="${unit.name}" onerror="this.src='https://via.placeholder.com/75?text=NATD'">
                        <div class="unit-rarity ${unit.rarity}">${unit.rarity}</div>
                        <div class="unit-name">${unit.name}</div>
                        <div class="unit-value">💎 ${unit.value.toLocaleString()}</div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        // 유닛 검색
        function filterUnits() {
            const text = document.getElementById('searchInput').value;
            renderUnits(text);
        }

        // 계산기에 유닛 추가
        function addUnitToCalc(unit) {
            selectedUnits.push(unit);
            updateCalcView();
        }

        // 선택 유닛 삭제
        function removeUnit(index) {
            selectedUnits.splice(index, 1);
            updateCalcView();
        }

        // 전체 초기화
        function clearCalculator() {
            selectedUnits = [];
            updateCalcView();
        }

        // 선택 목록 및 총합 업데이트
        function updateCalcView() {
            const list = document.getElementById('selectedList');
            const totalDisplay = document.getElementById('totalValue');
            
            list.innerHTML = '';
            let total = 0;

            selectedUnits.forEach((unit, index) => {
                total += unit.value;
                
                const item = document.createElement('div');
                item.className = `selected-item ${unit.rarity}`;
                
                item.innerHTML = `
                    <div>
                        <strong>${unit.name}</strong><br>
                        <span style="font-size:12px; color:#aaa;">💎 ${unit.value.toLocaleString()} 젬</span>
                    </div>
                    <button class="remove-btn" onclick="removeUnit(${index})">✕</button>
                `;
                list.appendChild(item);
            });

            totalDisplay.innerText = total.toLocaleString();
        }

        // 페이지 로드시 유닛 목록 렌더링
        renderUnits();
    </script>
</body>
</html>
