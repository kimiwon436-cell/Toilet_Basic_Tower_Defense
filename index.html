        h1 { text-align: center; margin-bottom: 10px; font-size: 28px; color: #ffffff; }

        /* 🔥 정렬 버튼 바 */
        .sort-bar {
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
            margin-bottom: 25px; padding: 10px; background: #14142b;
            border-radius: 12px; border: 1px solid #333;
        }
        .sort-btn {

        .tag.rare { background: #29b6f6; color: #000; }
        .tag.epic { background: #ab47bc; color: #fff; }
        .tag.legendary { background: #ffca28; color: #000; }
        .tag.mythical { background: #ef5350; color: #fff; }
        .tag.absolute { background: #000080; color: #fff; border: 1px solid #fff; box-shadow: 0 0 5px #00f; }
        .tag.exclusive { background: #ff69b4; color: #fff; border: 1px solid #ff1493; }

            { name: "Gingerbread Titan Speakerman 1.0", rarity: "mythical", value: 37000, img: "Gingerbread Titan Speakerman 1.0.png", tier: "S", type: "AOE", category:"unit", stats: [{ lv:1, dmg:2500, cool:1, range:20, price:1500 }, { lv:2, dmg:4500, cool:0.6, range:35, price:7500 }, { lv:3, dmg:6000, cool:0.4, range:40, price:10000 }, { lv:4, dmg:7500, cool:0.2, range:45, price:12000 }] },

            { name: "Upgrade Titan Tvman", rarity: "absolute", value: 35000, img: "Upgrade Titan Tvman.png", tier: "S", type: "AOE", category:"unit", stats: [{ lv:1, dmg:2500, cool:1, range:35, price:2500 }, { lv:2, dmg:5000, cool:0.5, range:40, price:5500 }, { lv:3, dmg:7500, cool:0.3, range:45, price:10000 }, { lv:4, dmg:8500, cool:0.2, range:50, price:12000 }, { lv:5, dmg:9500, cool:0.2, range:60, price:16000 }] },
            { name: "Injured Upgrade Titan Speakerman", rarity: "exclusive", value: 35, img: "Injured Upgrade Titan Speakerman.png", tier: "A", type: "Splash", category:"unit", stats: [{ lv:1, dmg:1500, cool:1, range:35, price:2000 }, { lv:2, dmg:2000, cool:0.7, range:45, price:6000 }, { lv:3, dmg:3500, cool:0.4, range:50, price:8500 }] },
            { name: "Saw Titan Cameraman", rarity: "exclusive", value: 35, img: "Saw Titan Cameraman.png", tier: "B", type: "Single", category:"unit", stats: [{ lv:1, dmg:1000, cool:1, range:20, price:1500 }, { lv:2, dmg:1500, cool:0.5, range:30, price:5000 }, { lv:3, dmg:2500, cool:0.3, range:35, price:7500 }] },
            { name: "Poison Titan Cameraman", rarity: "exclusive", value: 70, img: "Poison Titan Cameraman.png", tier: "A", type: "Splash", category:"unit", stats: [{ lv:1, dmg:1000, cool:1, range:25, price:1500 }, { lv:2, dmg:2000, cool:0.5, range:35, price:6500 }, { lv:3, dmg:3500, cool:0.25, range:40, price:11000 }] },
            
            { name: "Scientist Cameraman", rarity: "exclusive", value: 700, img: "Scientist Cameraman.png", tier: "S", type: "Farm", category:"unit", stats: [{ lv:1, dmg:200, cool:0, range:0, price:200 }, { lv:2, dmg:600, cool:0, range:0, price:200 }, { lv:3, dmg:800, cool:0, range:0, price:600 }, { lv:4, dmg:1000, cool:0, range:0, price:1000 }] },

            { name: "Jetpack Cameraman", rarity: "exclusive", value: 1750, img: "Jetpack Cameraman.png", tier: "A", type: "Single", category:"unit", stats: [{ lv:1, dmg:1500, cool:1.5, range:40, price:400 }, { lv:2, dmg:2500, cool:1.2, range:45, price:3000 }, { lv:3, dmg:4000, cool:1, range:50, price:5000 }] },
            { name: "Titan Speakerman", rarity: "exclusive", value: 3500, img: "Titan Speakerman.png", tier: "A", type: "Single", category:"unit", stats: [{ lv:1, dmg:1500, cool:1.5, range:30, price:1500 }, { lv:2, dmg:2000, cool:1, range:35, price:3500 }, { lv:3, dmg:3500, cool:0.5, range:40, price:5500 }] },
            
            { name: "Flamethrower Cameraman", rarity: "exclusive", value: 3500, img: "Flamethrower Cameraman.png", tier: "S", type: "Single", category:"unit", stats: [{ lv:1, dmg:150, cool:1, range:20, price:300 }, { lv:2, dmg:300, cool:0.85, range:25, price:1500 }, { lv:3, dmg:650, cool:0.3, range:35, price:4000 }, { lv:4, dmg:750, cool:0.2, range:40, price:5500 }] },

            { name: "Hyper Titan Speakerman", rarity: "exclusive", value: 26250, img: "Hyper Titan Speakerman.png", tier: "S", type: "AOE", category:"unit", stats: [{ lv:1, dmg:2000, cool:1, range:30, price:3000 }, { lv:2, dmg:3500, cool:0.6, range:35, price:6500 }, { lv:3, dmg:5500, cool:0.4, range:40, price:12000 }, { lv:4, dmg:7000, cool:0.35, range:45, price:14000 }] },
            { name: "Astro Titan Cameraman", rarity: "exclusive", value: 87500, img: "Astro Titan Cameraman.png", tier: "S", type: "Splash", category:"unit", stats: [{ lv:1, dmg:2500, cool:1, range:30, price:2500 }, { lv:2, dmg:4500, cool:0.8, range:35, price:6500 }, { lv:3, dmg:7000, cool:0.6, range:45, price:11000 }, { lv:4, dmg:8500, cool:0.4, range:55, price:13000 }, { lv:5, dmg:9500, cool:0.2, range:60, price:17500 }] },
            { name: "Christmas Crate", rarity: "crate", value: 70, img: "Christmas Crate.png", category: "crate", type: "Crate", contains: [{ name: "Tree Cameraman", prob: "50%" }, { name: "Santa Speakerman", prob: "34%" }, { name: "Rudolf Tvman", prob: "15.5%" }, { name: "Gingerbread Titan Speakerman 1.0", prob: "0.5%" }] },
            { name: "TITAN SPEAKERMAN CRATE", rarity: "crate", value: 150, img: "TITAN SPEAKERMAN CRATE.png", category: "crate", type: "Crate", contains: [{ name: "Injured Upgrade Titan Speakerman", prob: "99%" }, { name: "Hyper Titan Speakerman", prob: "1%" }] },
            { name: "TITAN CAMERAMAN CRATE", rarity: "crate", value: 200, img: "TITAN CAMERAMAN CRATE.png", category: "crate", type: "Crate", contains: [{ name: "Saw Titan Cameraman", prob: "60%" }, { name: "Poison Titan Cameraman", prob: "39.9%" }, { name: "Astro Titan Cameraman", prob: "0.1%" }] }
        ];

        // --- 전역 변수 ---
        let currentSortMode = 'rarity'; 
        let isDescending = false; 
        let tradeState = { me: [], partner: [] };
        let currentSelectorSide = null;
        let currentViewingUnitIndex = -1;

        const rarityOrder = { "common": 1, "uncommon": 2, "rare": 3, "epic": 4, "legendary": 5, "mythical": 6, "absolute": 7, "exclusive": 8, "crate": 9 };
        const typeOrder = { "Single": 1, "Farm": 2, "Splash": 3, "AOE": 4, "Crate": 5 };

        window.onload = function() { sortAndRender(); };

        function switchMode(mode) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(mode === 'list') document.querySelector('.nav-btn:nth-child(1)').classList.add('active');
            else document.querySelector('.nav-btn:nth-child(2)').classList.add('active');
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + mode).classList.add('active');
        }

        function setSort(mode) {
            currentSortMode = mode;
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            isDescending = (mode === 'value');
            sortAndRender();
        }

        function toggleReverse() { isDescending = !isDescending; sortAndRender(); }

        function sortAndRender() {
            unitData.sort((a, b) => {
                let diff = 0;
                if (currentSortMode === 'rarity') {
                    diff = rarityOrder[a.rarity] - rarityOrder[b.rarity];
                    if (diff === 0) diff = a.value - b.value;
                } else if (currentSortMode === 'type') {
                    diff = (typeOrder[a.type] || 0) - (typeOrder[b.type] || 0);
                    if (diff === 0) diff = a.value - b.value;
                } else if (currentSortMode === 'value') {
                    diff = a.value - b.value;
                }
                return isDescending ? -diff : diff;
            });
            renderValueList();
        }

        function renderValueList() {
            const grid = document.getElementById('value-list-grid');
            grid.innerHTML = '';
            unitData.forEach((unit, index) => {
                const card = document.createElement('div');
                card.className = 'unit-card';
                const tierClass = unit.category === 'crate' ? 'tier-none' : (unit.tier ? 'tier-' + unit.tier : 'tier-none');
                const tierHtml = unit.category === 'crate' ? '' : `<div class="${tierClass} tier-badge">${unit.tier}</div>`;
                card.innerHTML = `
                    <div class="card-image">
                        <img src="${unit.img}" onerror="this.src='https://via.placeholder.com/150?text=${unit.name}'">
                        <div class="unit-tags"><span class="tag ${unit.rarity}">${unit.rarity}</span></div>
                        ${tierHtml}
                    </div>
                    <div class="card-info">
                        <div class="unit-name">${unit.name}</div>
                        <div class="price-box"><p class="price-text">💎 ${unit.value.toLocaleString()}</p></div>
                    </div>
                `;
                card.onclick = () => openStatModal(index);
                grid.appendChild(card);
            });
        }

        function openStatModal(index) {
            currentViewingUnitIndex = index; const unit = unitData[index];
            const modal = document.getElementById('stat-modal');
            document.getElementById('detail-img').src = unit.img;
            document.getElementById('detail-name').innerText = unit.name;
            const tBadge = document.getElementById('modal-tier-badge');
            const typeBadge = document.getElementById('detail-type');
            typeBadge.className = 'type-badge type-' + (unit.type || 'Single');
            typeBadge.innerText = unit.type || 'Single';

            if (unit.category === 'crate') {
                tBadge.style.display = 'none'; document.getElementById('sign-calc-container').style.display = 'none';
                document.getElementById('more-stats-btn').style.display = 'none';
                document.getElementById('stat-table-head').innerHTML = `<tr><th>Unit Name</th><th>Prob%</th><th>Rarity</th><th>Value</th></tr>`;
                const tbody = document.getElementById('stat-table-body'); tbody.innerHTML = '';
                unit.contains.forEach(item => {
                    const targetUnit = unitData.find(u => u.name === item.name);
                    const r = targetUnit ? targetUnit.rarity : "?"; const v = targetUnit ? targetUnit.value.toLocaleString() : "?";
                    const row = document.createElement('tr');
                    row.innerHTML = `<td style="text-align:left; padding-left:10px;">${item.name}</td><td style="color:#ffca28; font-weight:bold;">${item.prob}</td><td><span class="tag ${r}" style="font-size:8px;">${r}</span></td><td style="color:#00e5ff;">💎${v}</td>`;
                    tbody.appendChild(row);
                });
            } else {
                tBadge.style.display = 'flex'; tBadge.className = 'tier-badge tier-' + (unit.tier || 'none'); tBadge.innerText = unit.tier || '?';
                document.getElementById('sign-calc-container').style.display = 'block'; document.getElementById('signer-role').value = "1";
                updateSignValue();
                const isFarm = unit.type === 'Farm';
                document.getElementById('stat-table-head').innerHTML = isFarm ? '<tr><th>Lv</th><th>Income</th><th>Price</th></tr>' : '<tr><th>Lv</th><th>Dmg</th><th>Cool</th><th>Range</th><th>Price</th></tr>';
                const tbody = document.getElementById('stat-table-body'); tbody.innerHTML = '';
                if (unit.stats) {
                    unit.stats.forEach((s, idx) => {
                        const row = document.createElement('tr'); if (idx > 0) row.classList.add('hidden-row');
                        row.innerHTML = isFarm ? `<td>${s.lv}</td><td style="color:#28a745; font-weight:bold;">+$${s.dmg.toLocaleString()}</td><td style="color:#ffff00;">$${s.price.toLocaleString()}</td>` : `<td>${s.lv}</td><td style="color:#ff6b6b; font-weight:bold;">${s.dmg.toLocaleString()}</td><td>${s.cool}s</td><td>${s.range}</td><td style="color:#ffff00;">$${s.price.toLocaleString()}</td>`;
                        tbody.appendChild(row);
                    });
                    document.getElementById('more-stats-btn').style.display = unit.stats.length > 1 ? 'block' : 'none';
                    document.getElementById('more-stats-btn').innerText = "🔽 Show More Levels";
                }
            }
            modal.style.display = 'flex';
        }

        function closeStatModal() { document.getElementById('stat-modal').style.display = 'none'; currentViewingUnitIndex = -1; }

        function updateSignValue() {
            if (currentViewingUnitIndex === -1) return;
            const unit = unitData[currentViewingUnitIndex]; if (unit.category === 'crate') return;
            const roleMult = parseFloat(document.getElementById('signer-role').value);
            document.getElementById('sign-val-display').innerText = "💎 " + (unit.value * roleMult).toLocaleString();
        }

        function toggleMoreStats() {
            const hiddenRows = document.querySelectorAll('.hidden-row');
            if (hiddenRows.length > 0) {
                hiddenRows.forEach(row => { row.classList.remove('hidden-row'); row.classList.add('shown-row'); });
                document.getElementById('more-stats-btn').innerText = "🔼 Hide Levels";
            } else {
                document.querySelectorAll('.shown-row').forEach(row => { row.classList.remove('shown-row'); row.classList.add('hidden-row'); });
                document.getElementById('more-stats-btn').innerText = "🔽 Show More Levels";
            }
        }

        // --- 거래 계산기 로직 ---
        function openSelector(side) {
            currentSelectorSide = side; document.getElementById('selector-modal').style.display = 'flex';
            const grid = document.getElementById('modal-grid'); grid.innerHTML = '';
            document.getElementById('trade-sign-select').value = "1";
            unitData.forEach((unit, index) => {
                const card = document.createElement('div'); card.className = 'unit-card';
                const tierClass = unit.category === 'crate' ? 'tier-none' : (unit.tier ? 'tier-' + unit.tier : 'tier-none');
                card.innerHTML = `
                    <div class="card-image" style="height:120px;">
                        <img src="${unit.img}" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="unit-tags"><span class="tag ${unit.rarity}">${unit.rarity}</span></div>
                        <div class="${tierClass} tier-badge" style="width:24px; height:24px; font-size:12px; top:4px; right:4px;">${unit.tier}</div>
                    </div>
                    <div class="card-info"><div class="unit-name" style="font-size:12px;">${unit.name}</div><div class="price-text">💎 ${unit.value.toLocaleString()}</div></div>
                `;
                card.onclick = () => addItemToTrade(index); grid.appendChild(card);
            });
        }
        function closeSelector() { document.getElementById('selector-modal').style.display = 'none'; }
        function addItemToTrade(index) {
            const unit = unitData[index]; const roleMult = parseFloat(document.getElementById('trade-sign-select').value);
            let signLabel = "";
            if(roleMult === 1.5) signLabel = "Partner"; else if(roleMult === 2) signLabel = "Developer";
            else if(roleMult === 3) signLabel = "Co-Owner"; else if(roleMult === 4) signLabel = "CEO";
            tradeState[currentSelectorSide].push({ ...unit, id: Date.now(), finalValue: unit.value * roleMult, signLabel: signLabel });
            updateTradeUI(); closeSelector();
        }
        function removeItem(side, id) { tradeState[side] = tradeState[side].filter(i => i.id !== id); updateTradeUI(); }
        function updateTradeUI() { renderSlots('me'); renderSlots('partner'); calcResult(); }
        function renderSlots(side) {
            const container = document.getElementById(`slots-${side}`); let total = 0; container.innerHTML = '';
            tradeState[side].forEach(item => {
                total += item.finalValue; const slot = document.createElement('div'); slot.className = 'mini-card';
                let badgeHtml = item.signLabel ? `<div class="signed-badge-overlay">${item.signLabel}</div>` : "";
                slot.innerHTML = `<img src="${item.img}" onerror="this.src='https://via.placeholder.com/150'">${badgeHtml}<div class="mini-val">💎 ${item.finalValue.toLocaleString()}</div>`;
                slot.onclick = () => removeItem(side, item.id); container.appendChild(slot);
            });
            document.getElementById(`total-${side}`).innerText = total.toLocaleString();
        }
        function calcResult() {
            const me = tradeState.me.reduce((a,b) => a + b.finalValue, 0); const partner = tradeState.partner.reduce((a,b) => a + b.finalValue, 0);
            const panel = document.getElementById('result-panel'); if(me===0 && partner===0) { panel.style.display='none'; return; }
            panel.style.display='block'; const badge = document.getElementById('result-badge'); const txt = document.getElementById('result-text');
            const diff = partner - me;
            if(diff > 0) { badge.innerText="WIN"; badge.className="status-badge win"; txt.innerText=`+${diff.toLocaleString()} Gems Gain`; }
            else if(diff < 0) { badge.innerText="LOSS"; badge.className="status-badge loss"; txt.innerText=`${Math.abs(diff).toLocaleString()} Gems Loss`; }
            else { badge.innerText="FAIR"; badge.className="status-badge fair"; txt.innerText="Perfectly Fair"; }
        }
    </script>
