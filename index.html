<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATD 가치 계산기 (Value Calculator)</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --border-color: #333333;
            
            /* 등급별 색상 */
            --common: #B0BEC5;    /* 회색 */
            --uncommon: #4CAF50;  /* 초록 */
            --rare: #2196F3;      /* 파랑 */
            --epic: #9C27B0;      /* 보라 */
            --legendary: #FFC107; /* 노랑/금색 */
            --mythical: #F44336;  /* 빨강 */
            --exclusive: #FF4081; /* 핑크 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* 왼쪽 패널: 유닛 목록 */
        .unit-list-panel {
            flex: 2;
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
            height: 80vh;
            overflow-y: auto;
        }

        /* 오른쪽 패널: 계산기 영역 */
        .calculator-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        .search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: #2c2c2c;
            color: white;
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* 유닛 카드 디자인 */
        .unit-card {
            background-color: #2c2c2c;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .unit-card:hover {
            transform: translateY(-3px);
            border-color: white;
        }

        .unit-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            background-color: #1a1a1a;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .unit-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            word-break: keep-all;
        }

        .unit-value {
            font-size: 13px;
            color: #4CAF50;
            font-weight: bold;
        }

        .unit-rarity {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
            color: white;
        }

        /* 등급별 백그라운드 색상 적용 */
        .Common { background-color: var(--common); color: black; }
        .Uncommon { background-color: var(--uncommon); }
        .Rare { background-color: var(--rare); }
        .Epic { background-color: var(--epic); }
        .Legendary { background-color: var(--legendary); color: black; }
        .Mythical { background-color: var(--mythical); }
        .Exclusive { background-color: var(--exclusive); }

        /* 계산기 영역 디자인 */
        .calc-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .selected-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c2c2c;
            padding: 10px;
            border-radius: 5px;
            border-left: 5px solid gray;
        }

        .selected-item.Common { border-left-color: var(--common); }
        .selected-item.Uncommon { border-left-color: var(--uncommon); }
        .selected-item.Rare { border-left-color: var(--rare); }
        .selected-item.Epic { border-left-color: var(--epic); }
        .selected-item.Legendary { border-left-color: var(--legendary); }
        .selected-item.Mythical { border-left-color: var(--mythical); }
        .selected-item.Exclusive { border-left-color: var(--exclusive); }

        .remove-btn {
            background-color: var(--mythical);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn:hover {
            background-color: #d32f2f;
        }

        .total-box {
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--legendary);
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .clear-btn:hover {
            background-color: #777;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .unit-list-panel, .calculator-panel { height: auto; max-height: 50vh; }
        }
    </style>
</head>
<body>

    <h1>💎 NATD 거래 가치 계산기</h1>

    <div class="container">
        <!-- 왼쪽 패널: 유닛 선택창 -->
        <div class="unit-list-panel">
            <input type="text" id="searchInput" class="search-bar" placeholder="유닛 이름 검색..." onkeyup="filterUnits()">
            <div id="unitGrid" class="grid-container">
                <!-- 자바스크립트로 유닛 생성됨 -->
            </div>
        </div>

        <!-- 오른쪽 패널: 계산된 유닛 & 총합 -->
        <div class="calculator-panel">
            <div class="calc-header">선택된 유닛 목록</div>
            <div id="selectedList" class="selected-list">
                <!-- 선택한 유닛이 여기에 추가됨 -->
            </div>
            
            <div class="total-box">
                총 가치: <span id="totalValue">0</span> 젬
            </div>
            <button class="clear-btn" onclick="clearCalculator()">초기화 (Clear All)</button>
        </div>
    </div>

    <script>
        // 요청하신 20종 유닛 데이터 설정 (분류, 가치, 이미지 경로 정확히 매칭)
        const unitData = [
            // Common
            { name: "Noob", rarity: "Common", value: 1, img: "NATD/Noob.png" },
            
            // Uncommon
            { name: "Soldier Noob", rarity: "Uncommon", value: 3, img: "NATD/Soldier Noob.png" },
            { name: "Zombie Noob", rarity: "Uncommon", value: 3, img: "NATD/Zombie Noob.png" },
            
            // Rare
            { name: "Boxer Noob", rarity: "Rare", value: 6, img: "NATD/Boxer Noob.png" },
            { name: "SledgeHammer Noob", rarity: "Rare", value: 7, img: "NATD/SledgeHammer Noob.png" },
            { name: "Spear Noob", rarity: "Rare", value: 10, img: "NATD/Spear Noob.png" },
            
            // Epic
            { name: "Knight Noob", rarity: "Epic", value: 40, img: "NATD/Knight Noob.png" },
            { name: "Medic Noob", rarity: "Epic", value: 20, img: "NATD/Medic Noob.png" },
            { name: "Ninja Noob", rarity: "Epic", value: 70, img: "NATD/Ninja Noob.png" },
            { name: "Shielder Noob", rarity: "Epic", value: 70, img: "NATD/Shielder Noob.png" },
            
            // Legendary
            { name: "Barbarian Noob", rarity: "Legendary", value: 150, img: "NATD/Barbarian Noob.png" },
            { name: "Builder Noob", rarity: "Legendary", value: 300, img: "NATD/Builder Noob.png" },
            { name: "Gunner Noob", rarity: "Legendary", value: 100, img: "NATD/Gunner Noob.png" },
            { name: "Nature Noob", rarity: "Legendary", value: 250, img: "NATD/Nature Noob.png" },
            
            // Mythical
            { name: "Hologram Noob", rarity: "Mythical", value: 3000, img: "NATD/Hologram Noob.png" },
            { name: "King Noob", rarity: "Mythical", value: 2000, img: "NATD/King Noob.png" },
            { name: "Laser Noob", rarity: "Mythical", value: 800, img: "NATD/Laser Noob.png" },
            { name: "Magical Noob", rarity: "Mythical", value: 1500, img: "NATD/Magical Noob.png" },
            
            // Exclusive
            { name: "Fairy Noob", rarity: "Exclusive", value: 250, img: "NATD/Fairy Noob.png" },
            { name: "Mafia Noob", rarity: "Exclusive", value: 900, img: "NATD/Mafia Noob.png" }
        ];

        let selectedUnits = [];

        // 왼쪽 패널에 유닛 목록 렌더링
        function renderUnits(filterText = "") {
            const grid = document.getElementById('unitGrid');
            grid.innerHTML = '';

            unitData.forEach(unit => {
                if (unit.name.toLowerCase().includes(filterText.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = `unit-card`;
                    // 카드 클릭 시 계산기에 추가
                    card.onclick = () => addUnitToCalc(unit);

                    card.innerHTML = `
                        <img src="${unit.img}" alt="${unit.name}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'">
                        <div class="unit-rarity ${unit.rarity}">${unit.rarity}</div>
                        <div class="unit-name">${unit.name}</div>
                        <div class="unit-value">💎 ${unit.value.toLocaleString()}</div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        // 검색 필터링 기능
        function filterUnits() {
            const text = document.getElementById('searchInput').value;
            renderUnits(text);
        }

        // 유닛을 오른쪽 계산기에 추가
        function addUnitToCalc(unit) {
            selectedUnits.push(unit);
            updateCalcView();
        }

        // 유닛을 계산기에서 제거
        function removeUnit(index) {
            selectedUnits.splice(index, 1);
            updateCalcView();
        }

        // 전체 초기화
        function clearCalculator() {
            selectedUnits = [];
            updateCalcView();
        }

        // 오른쪽 패널 (계산기 영역) UI 업데이트
        function updateCalcView() {
            const list = document.getElementById('selectedList');
            const totalDisplay = document.getElementById('totalValue');
            
            list.innerHTML = '';
            let total = 0;

            selectedUnits.forEach((unit, index) => {
                total += unit.value;
                
                const item = document.createElement('div');
                item.className = `selected-item ${unit.rarity}`;
                
                item.innerHTML = `
                    <div>
                        <strong>${unit.name}</strong> <br>
                        <span style="font-size:12px; color:#ccc;">💎 ${unit.value.toLocaleString()} 젬</span>
                    </div>
                    <button class="remove-btn" onclick="removeUnit(${index})">X</button>
                `;
                list.appendChild(item);
            });

            // 총합 업데이트
            totalDisplay.innerText = total.toLocaleString();
        }

        // 최초 실행
        renderUnits();
    </script>
</body>
</html>
