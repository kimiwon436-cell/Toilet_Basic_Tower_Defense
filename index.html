<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noob Tower Defense Value Hub</title>
    <style>
        :root {
            --bg-main: #0b0c10; --panel-bg: #14171f; --card-bg: #1a1e29;
            --border-color: #272c3d; --text-primary: #ffffff; --text-secondary: #94a3b8;
            --accent-green: #22c55e; --accent-yellow: #eab308; --accent-pink: #ec4899;
            --accent-purple: #a855f7; --accent-blue: #3b82f6; --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding: 20px 10px; display: flex; justify-content: center; }
        .main-wrapper { width: 100%; max-width: 1280px; display: flex; flex-direction: column; gap: 16px; }
        .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .nav-tab-btn { background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .nav-tab-btn.active, .nav-tab-btn:hover { background-color: #262b3a; color: #fff; border-color: #3b4259; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .coming-soon-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 40px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; }
        .roblox-btn { background-color: #fff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .roblox-btn:hover { background-color: #e5e5e5; }
        .calc-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .calc-panel-header { font-weight: bold; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .search-input { background: #11131a; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; width: 100%; outline: none; }
        .trade-btn { background-color: var(--accent-blue); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 13px; display: inline-block; text-align: center; }
        .trade-btn.profile { background-color: #334155; }
        .ad-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
        .ad-user-info { display: flex; align-items: center; gap: 10px; min-width: 140px; }
        .ad-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border-color); object-fit: cover; }
        .ad-username { font-size: 13px; font-weight: 700; }
        .ad-time { font-size: 10px; color: var(--text-secondary); }
        .ad-body { flex: 1; display: flex; gap: 10px; align-items: center; background: #11131a; padding: 8px; border-radius: 8px; flex-wrap: wrap; }
        .selected-unit-mini { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 4px; text-align: center; width: 55px; }
        .selected-unit-mini img { width: 30px; height: 30px; object-fit: contain; }
        .selected-unit-mini .name { font-size: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .add-unit-btn { background: #222938; border: 1px dashed var(--border-color); color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 14px; width: 90%; max-width: 500px; padding: 16px; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; max-height: 60vh; overflow-y: auto; margin-top: 10px; }
        .modal-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; font-size: 11px; }
        
        /* 추가 탭 스타일 */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
        .unit-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: center; }
        .category-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .filter-btn { background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background-color: #2d3446; color: #fff; }
        .tier-row { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; display: flex; overflow: hidden; }
        .tier-label { width: 70px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #000; }
        .tier-S { background: #ff7f7f; } .tier-A { background: #ffbf7f; } .tier-B { background: #ffff7f; } .tier-C { background: #7fff7f; } .tier-D { background: #7fffff; }
        .tier-items { padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
        .tier-unit-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px; text-align: center; width: 75px; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- 상단 네비게이션 탭 -->
        <div class="nav-tabs">
            <button class="nav-tab-btn active" onclick="switchTab('valuelist', this)">Value List</button>
            <button class="nav-tab-btn" onclick="switchTab('calculator', this)">Trade Calculator</button>
            <button class="nav-tab-btn" onclick="switchTab('ads', this)">Trade Ads (서버 연동)</button>
            <button class="nav-tab-btn" onclick="switchTab('tierlist', this)">Tier Lists</button>
            <button class="nav-tab-btn" onclick="switchTab('codes', this)">Codes</button>
            <button class="nav-tab-btn" onclick="switchTab('discord', this)">Discord</button>
        </div>

        <!-- 1. Value List 탭 -->
        <div id="tab-valuelist" class="tab-pane active">
            <div class="category-filters">
                <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
                <button class="filter-btn" onclick="setCategory('Mythical', this)">Mythical</button>
                <button class="filter-btn" onclick="setCategory('Exclusive', this)">Exclusive</button>
            </div>
            <div class="card-grid" id="cardGrid"></div>
        </div>

        <!-- 2. Trade Calculator 탭 -->
        <div id="tab-calculator" class="tab-pane">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="calc-panel">
                    <div class="calc-panel-header"><span>My Offer</span></div>
                    <button class="add-unit-btn" onclick="openPicker('offer')">+ 유닛 추가</button>
                    <div id="calcOfferPreview" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
                </div>
                <div class="calc-panel">
                    <div class="calc-panel-header"><span>Request Offer</span></div>
                    <button class="add-unit-btn" onclick="openPicker('request')">+ 유닛 추가</button>
                    <div id="calcRequestPreview" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
                </div>
            </div>
        </div>

        <!-- 3. Trade Ads 탭 (실시간 서버 연동) -->
        <div id="tab-ads" class="tab-pane">
            <!-- 로그인 전 -->
            <div id="roblox-login-box" class="coming-soon-box">
                <div style="font-size: 40px;">🔗</div>
                <h3>로블록스 계정 연동 및 프로필 등록</h3>
                <p style="font-size: 13px; color: var(--text-secondary);">원활한 인게임 거래 참가를 위해 본인의 로블록스 프로필 주소를 입력해주세요.</p>
                <input type="text" id="rbxUser" class="search-input" placeholder="로블록스 닉네임 입력 (예: RobloxKing)" style="max-width: 300px;">
                <input type="text" id="rbxProfileLink" class="search-input" placeholder="로블록스 프로필 URL (예: https://www.roblox.com/users/123456/profile)" style="max-width: 300px;">
                <button class="roblox-btn" onclick="connectRobloxAccount()">연동 완료 후 시작하기</button>
            </div>

            <!-- 로그인 후 대시보드 -->
            <div id="trade-ads-dashboard" class="ad-dashboard" style="display: none; flex-direction: column; gap: 16px;">
                <div class="calc-panel">
                    <div class="calc-panel-header"><span>📝 새 거래 글 작성 (연동 계정: <span id="currentUserName" style="color:var(--accent-green)"></span>)</span></div>
                    <div>
                        <div style="font-size: 12px; color:var(--text-secondary); margin-bottom:4px;">내가 주는 유닛 (Offering):</div>
                        <button class="add-unit-btn" onclick="openPicker('offer')">+ 유닛 추가</button>
                        <div id="adOfferPreview" style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;"></div>
                    </div>
                    <div style="margin-top: 8px;">
                        <div style="font-size: 12px; color:var(--text-secondary); margin-bottom:4px;">원하는 유닛 (Looking For):</div>
                        <button class="add-unit-btn" onclick="openPicker('request')">+ 유닛 추가</button>
                        <div id="adRequestPreview" style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;"></div>
                    </div>
                    <input type="text" id="adNote" class="search-input" style="margin-top: 8px;" placeholder="추가 메모 (예: 친추 받고 바로 들어오세요!)">
                    <button class="trade-btn" style="margin-top: 8px; align-self: flex-end;" onclick="submitTradeAd()">게시물 등록하기</button>
                </div>

                <div class="calc-panel">
                    <div class="calc-panel-header"><span>📢 실시간 거래 피드 (서버 저장됨)</span></div>
                    <div id="ads-feed"></div>
                </div>
            </div>
        </div>

        <!-- 4. Tier Lists 탭 -->
        <div id="tab-tierlist" class="tab-pane">
            <div class="tier-row"><div class="tier-label tier-S">S</div><div id="tier-S" class="tier-items"></div></div>
            <div class="tier-row"><div class="tier-label tier-A">A</div><div id="tier-A" class="tier-items"></div></div>
            <div class="tier-row"><div class="tier-label tier-B">B</div><div id="tier-B" class="tier-items"></div></div>
        </div>

        <!-- 5. Codes 탭 -->
        <div id="tab-codes" class="tab-pane">
            <div class="coming-soon-box"><h3>🎁 Codes Coming Soon!</h3></div>
        </div>

        <!-- 6. Discord 탭 -->
        <div id="tab-discord" class="tab-pane">
            <div class="coming-soon-box"><h3>💬 Discord Coming Soon!</h3></div>
        </div>
    </div>

    <!-- 유닛 선택 모달 -->
    <div id="unitModal" class="modal-overlay">
        <div class="modal-body">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>유닛 선택</h3>
                <button onclick="closePicker()" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
            </div>
            <div id="modalGrid" class="modal-grid"></div>
        </div>
    </div>

    <script>
        const unitData = [
            { id: 1, name: "Hologram Noob", rarity: "Mythical", tier: "S", value: 3000, img: "Hologram_Noob.png" },
            { id: 2, name: "King Noob", rarity: "Mythical", tier: "S", value: 2000, img: "King_Noob.png" },
            { id: 4, name: "Mafia Noob", rarity: "Exclusive", tier: "A", value: 900, img: "Mafia_Noob.png" },
            { id: 5, name: "Laser Noob", rarity: "Mythical", tier: "A", value: 800, img: "Laser_Noob.png" }
        ];

        let currentUser = null;
        let adOffer = [];
        let adRequest = [];
        let pickerTarget = '';
        let selectedCategory = 'All';

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');
        }

        function connectRobloxAccount() {
            const username = document.getElementById('rbxUser').value.trim();
            const profileUrl = document.getElementById('rbxProfileLink').value.trim();

            if (!username || !profileUrl) {
                alert("닉네임과 로블록스 프로필 링크를 모두 입력해주세요!");
                return;
            }

            currentUser = {
                username: username,
                profileUrl: profileUrl,
                avatar: "https://tr.rbxcdn.com/15053a479bba760317e08cdce013143c/150/150/AvatarHeadshot/Png"
            };

            document.getElementById('roblox-login-box').style.display = 'none';
            document.getElementById('trade-ads-dashboard').style.display = 'flex';
            document.getElementById('currentUserName').innerText = username;
            loadTradeAds();
        }

        function openPicker(target) {
            pickerTarget = target;
            const grid = document.getElementById('modalGrid');
            grid.innerHTML = '';
            unitData.forEach(u => {
                grid.innerHTML += `<div class="modal-item" onclick="selectUnit(${u.id})">
                    <img src="./${u.img}" width="30" onerror="this.src='https://via.placeholder.com/30'"><br>${u.name}
                </div>`;
            });
            document.getElementById('unitModal').style.display = 'flex';
        }

        function selectUnit(id) {
            const unit = unitData.find(u => u.id === id);
            if (pickerTarget === 'offer') adOffer.push(unit);
            else adRequest.push(unit);
            closePicker();
            updatePreviews();
        }

        function closePicker() { document.getElementById('unitModal').style.display = 'none'; }

        function updatePreviews() {
            document.getElementById('adOfferPreview').innerHTML = adOffer.map(u => `<div class="selected-unit-mini"><img src="./${u.img}"><div class="name">${u.name}</div></div>`).join('');
            document.getElementById('adRequestPreview').innerHTML = adRequest.map(u => `<div class="selected-unit-mini"><img src="./${u.img}"><div class="name">${u.name}</div></div>`).join('');
        }

        async function loadTradeAds() {
            try {
                const res = await fetch('http://localhost:3000/api/trades');
                const trades = await res.json();
                const feed = document.getElementById('ads-feed');
                feed.innerHTML = '';

                trades.forEach(ad => {
                    const offerHtml = ad.offerUnits.map(u => `<div class="selected-unit-mini"><img src="./${u.img}"><div class="name">${u.name}</div></div>`).join('');
                    const requestHtml = ad.requestUnits.map(u => `<div class="selected-unit-mini"><img src="./${u.img}"><div class="name">${u.name}</div></div>`).join('');

                    feed.innerHTML += `
                        <div class="ad-card">
                            <div class="ad-user-info">
                                <img src="${ad.avatar}" class="ad-avatar">
                                <div>
                                    <div class="ad-username">${ad.username}</div>
                                    <div class="ad-time">${ad.time || '방금 전'}</div>
                                </div>
                            </div>
                            <div class="ad-body">
                                <div><b>Give:</b></div><div style="display:flex;gap:4px;">${offerHtml || '없음'}</div>
                                <div style="margin:0 5px;">➔</div>
                                <div><b>Want:</b></div><div style="display:flex;gap:4px;">${requestHtml || '아무거나'}</div>
                                ${ad.note ? `<div style="font-size:11px; color:#94a3b8; width:100%;">💬 ${ad.note}</div>` : ''}
                            </div>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <a href="${ad.profileUrl}" target="_blank" class="trade-btn profile">👤 프로필</a>
                                <a href="${ad.profileUrl}" target="_blank" class="trade-btn">🎮 Trade</a>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("서버에서 데이터를 불러오지 못했습니다.", e);
            }
        }

        async function submitTradeAd() {
            if (adOffer.length === 0 && adRequest.length === 0) {
                alert("유닛을 최소 1개 이상 선택해주세요!");
                return;
            }

            const note = document.getElementById('adNote').value;

            try {
                const response = await fetch('http://localhost:3000/api/trades', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        avatar: currentUser.avatar,
                        profileUrl: currentUser.profileUrl,
                        offerUnits: adOffer,
                        requestUnits: adRequest,
                        note: note
                    })
                });

                if (response.ok) {
                    adOffer = [];
                    adRequest = [];
                    document.getElementById('adNote').value = '';
                    updatePreviews();
                    loadTradeAds();
                }
            } catch (e) {
                alert("서버 연결에 실패했습니다. Node.js 서버 상태를 확인해주세요.");
            }
        }

        function renderValueList() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            unitData.forEach(u => {
                if (selectedCategory === 'All' || u.rarity === selectedCategory) {
                    grid.innerHTML += `<div class="unit-card"><b>${u.name}</b><span style="color:var(--accent-pink);">${u.rarity}</span><img src="./${u.img}" width="60" style="margin:10px 0;"><div>💎 ${u.value}</div></div>`;
                }
            });
        }

        function setCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderValueList();
        }

        function initTierList() {
            ['S', 'A', 'B'].forEach(tier => {
                const container = document.getElementById(`tier-${tier}`);
                if(container) {
                    unitData.filter(u => u.tier === tier).forEach(u => {
                        container.innerHTML += `<div class="tier-unit-card"><img src="./${u.img}" width="40"><div class="name">${u.name}</div></div>`;
                    });
                }
            });
        }

        renderValueList();
        initTierList();
    </script>
</body>
</html>
